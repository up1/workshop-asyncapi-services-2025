asyncapi: 3.0.0
info:
  title: Create a new Order in Kafka
  version: 1.0.0
  description: The API notifies you whenever a new order is created in the application.
servers:
  kafkaServer:
    host: localhost:19092
    description: Kafka Server
    protocol: kafka
    bindings:
      kafka:
        bindingVersion: '0.5.0'
operations:
  onOrderCreated:
    action: receive
    channel:
      $ref: '#/channels/orderCreated'
    bindings:
      kafka:
        bindingVersion: '0.5.0'
channels:
  orderCreated:
    description: This channel contains a message for each order that is created in our application.
    address: order_created
    messages:
      orderCreated:
        $ref: '#/components/messages/Order'
    bindings:
      kafka:
        bindingVersion: '0.5.0'
        partitions: 10
        replicas: 2
        topicConfiguration:
          topicName: order_created
          cleanup.policy: ["delete", "compact"]
          retention.ms: 604800000
          retention.bytes: 1000000000
          delete.retention.ms: 86400000
          max.message.bytes: 1048588
components:
  messages:
    Order:
      name: OrderMessage
      title: An order message
      payload:
        type: object
        properties:
          orderId:
            type: string
            description: Unique identifier for the order.
          customerId:
            type: string
            description: Unique identifier for the customer.
          totalAmount:
            type: number
            format: float
            description: Total order amount.
          items:
            type: array
            description: List of items in the order.
            items:
              type: object
              properties:
                productId:
                  type: string
                  description: Unique identifier for the product.
                quantity:
                  type: integer
                  description: Quantity of the product.
        required: 
          - orderId
               